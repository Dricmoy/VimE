name: VimE
options:
  bundleIdPrefix: com.dric
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode signs ad-hoc; `make build`/`make install` then re-sign with the local
    # identity from scripts/setup-signing.sh so Accessibility permission survives rebuilds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode's debug builds load the app's code from a separate VimE.debug.dylib; with no Team ID,
    # hardened runtime's library validation refuses to load it.
    ENABLE_DEBUG_DYLIB: NO
targets:
  # Static, so nothing is embedded: hardened runtime's library validation rejects embedded frameworks
  # signed by the local identity, which has no Team ID.
  VimECore:
    type: library.static
    platform: macOS
    sources: [VimECore]
  VimE:
    type: application
    platform: macOS
    sources: [VimE]
    dependencies:
      - target: VimECore
    info:
      path: VimE/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: VimE
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Vim everywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dric.VimE
      configs:
        # Its own identity, so Debug builds never carry the installed app's Accessibility permission
        # (or its settings).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.dric.VimE.debug
  VimECoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VimECoreTests]
    dependencies:
      - target: VimECore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VimE:
    build:
      targets:
        VimE: all
        VimECore: all
    test:
      targets: [VimECoreTests]
